name: Build production calendar
on:
  push:
    paths: ["calendar/events.json", "calendar/build_ics.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 calendar/build_ics.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar/production.ics
          git diff --cached --quiet || { git commit -m "Rebuild production calendar"; git push; }
