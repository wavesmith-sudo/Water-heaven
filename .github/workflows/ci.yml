name: Baseline checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r services/backend/requirements-dev.txt
      - run: bash scripts/verify.sh

  qt-app:
    # Desktop Qt 6.4 (Ubuntu 24.04) build of the device UI. The device image uses Qt 6.9
    # from Buildroot (device/cm5-os/toolchain.lock), which this job does not cover.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6 and GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ \
            qt6-base-dev qt6-declarative-dev qt6-multimedia-dev qt6-qpa-plugins \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-templates \
            qml6-module-qtquick-window qml6-module-qtmultimedia qml6-module-qtqml-workerscript \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-libav gstreamer1.0-tools ffmpeg libgl-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r services/backend/requirements-dev.txt
      - run: bash scripts/verify.sh --qt
