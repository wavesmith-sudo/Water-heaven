<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <!--Set visual viewport size for mobile devices to the device size,
        witch results in a scale of 1 and a 1:1 mapping between CSS pixels
        and Qt device independent pixels. -->
    <meta name="viewport" content="width=device-width, height=device-height, user-scalable=0"/>

    <title>Retro Arcade preview</title>
    <style>
      /* Make the html body cover the entire (visual) viewport with no scroll bars. */
      html, body { padding: 0; margin: 0; overflow: hidden; height: 100% }
      #screen { width: 100%; height: 100%; }
    </style>
  <meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<style>
  html, body { background: #0d0820; margin: 0; overflow: hidden; }
  #arcade-banner {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 10;
    font: 14px/1.4 system-ui, sans-serif; color: #fff; background: rgba(26, 18, 51, .92);
    border: 1px solid #4d3e70; border-radius: 10px; padding: 8px 14px; max-width: calc(100vw - 32px);
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap; transition: opacity .4s;
  }
  #arcade-banner b { color: #29e8f2; }
  #arcade-banner kbd { background: #2a1d4d; border: 1px solid #6b5a99; border-radius: 4px; padding: 0 5px; font: inherit; }
  #arcade-banner button { background: none; border: 0; color: #b9add6; font: inherit; cursor: pointer; }
  #arcade-banner.hidden { opacity: 0; pointer-events: none; }
</style>
</head>
  <body onload="init()">
    <figure style="overflow:visible;" id="qtspinner">
      <center style="margin-top:1.5em; line-height:150%">
        <img src="qtlogo.svg" width="320" height="200" style="display:block"></img>
        <strong>Qt for WebAssembly: cm5-home-preview</strong>
        <div id="qtstatus"></div>
        <noscript>JavaScript is disabled. Please enable JavaScript to use this application.</noscript>
      </center>
    </figure>
    <div id="screen"></div>

    <script type="text/javascript">
        async function init()
        {
            const spinner = document.querySelector('#qtspinner');
            const screen = document.querySelector('#screen');
            const status = document.querySelector('#qtstatus');

            const showUi = (ui) => {
                [spinner, screen].forEach(element => element.style.display = 'none');
                if (screen === ui)
                    screen.style.position = 'default';
                ui.style.display = 'block';
            }

            try {
                showUi(spinner);
                status.innerHTML = 'Loading...';

                const instance = await qtLoad({
                    qt: {
                        onLoaded: () => showUi(screen),
                        onExit: exitData =>
                        {
                            status.innerHTML = 'Application exit';
                            status.innerHTML +=
                                exitData.code !== undefined ? ` with code ${exitData.code}` : '';
                            status.innerHTML +=
                                exitData.text !== undefined ? ` (${exitData.text})` : '';
                            showUi(spinner);
                        },
                        entryFunction: window.cm5_home_preview_entry,
                        containerElements: [screen],
                        
                    }
                });
            } catch (e) {
                console.error(e);
                console.error(e.stack);
            }
        }
    </script>
    <script src="cm5-home-preview.js"></script>
    <script type="text/javascript" src="qtloader.js"></script>
  <div id="arcade-banner" role="note">
  <span><b>Preview</b> with made-up demo titles. No real server.</span>
  <span>Click the screen, then <kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> move, <kbd>Enter</kbd> select, <kbd>Esc</kbd> back</span>
  <button type="button" aria-label="Hide help" onclick="this.parentNode.classList.add('hidden')">✕</button>
</div>
</body>
</html>
