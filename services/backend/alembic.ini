# For the alembic CLI (revision --autogenerate etc.). The API runs migrations itself at startup.
[alembic]
script_location = app/migrations
prepend_sys_path = .
sqlalchemy.url = sqlite:///./arcade.db

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
